<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lists and table</title>
  </head>
  <body>
    <!-- Unordered Lists-->
    <h3>Unordered List</h3>
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
      <li>Item 4</li>
    </ul>
    <br />
    <!-- Ordered Lists-->
    <h3>Ordered List</h3>
    <ol>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
      <li>Item 4</li>
    </ol>
    <br />
    <!--Table-->
    <h3>Table</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Balaram</td>
          <td>b@gmail.com</td>
          <td>21</td>
        </tr>
        <tr>
          <td>Tam</td>
          <td>T@gmail.com</td>
          <td>20</td>
        </tr>
        <tr>
          <td>Adam</td>
          <td>a@gmail.com</td>
          <td>25</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
