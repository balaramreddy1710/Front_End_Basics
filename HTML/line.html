<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poem</title>
  </head>
  <body style="background-color: powderblue">
    <h1 style="background-color: blue; text-align: center">Poem</h1>
    <p style="color: red; text-align: center">
      My <strong>Bonnie</strong> lies over the <b>ocean</b>. <br />
      My <i>Bonnie</i> lies over the <em>sea</em>.<br />
      My <mark>Bonnie</mark> lies over the <small>ocean</small>.<br />
      Oh, bring back my Bonnie to me.
    </p>
    <pre>
      My Bonnie lies over the ocean. 
    <hr>
      My Bonnie lies over the sea.
    <hr>
      My Bonnie lies over the ocean.
    <hr>
      Oh, bring back my Bonnie to me.
    </pre>
  </body>
</html>
